<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7928CA"/>
      <stop offset="100%" style="stop-color:#FF0080"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0f0c29"/>
  <rect width="100" height="100" rx="24" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>

  <!-- Main bubble -->
  <rect x="10" y="15" width="62" height="45" rx="12" fill="url(#grad)" filter="url(#glow)"/>

  <!-- Bubble tail -->
  <path d="M20 60 L12 74 L36 60Z" fill="url(#grad)"/>

  <!-- Lines in bubble -->
  <rect x="19" y="27" width="36" height="4" rx="2" fill="white" opacity="0.9"/>
  <rect x="19" y="36" width="26" height="4" rx="2" fill="white" opacity="0.6"/>
  <rect x="19" y="45" width="18" height="4" rx="2" fill="white" opacity="0.4"/>

  <!-- Second bubble -->
  <rect x="54" y="44" width="36" height="26" rx="9" fill="#1a1040" stroke="url(#grad)" stroke-width="1.5"/>

  <!-- Typing dots -->
  <circle cx="63" cy="57" r="3" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="72" cy="57" r="3" fill="url(#grad)" opacity="0.6"/>
  <circle cx="81" cy="57" r="3" fill="url(#grad)" opacity="0.3"/>

  <!-- Bottom N text -->
  <text x="12" y="96"
    font-family="'Arial Black', sans-serif"
    font-size="14"
    font-weight="900"
    fill="url(#grad)"
    letter-spacing="1"
  >NexChat</text>

</svg>